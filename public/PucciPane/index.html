<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Briciole Clicker</title>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Comic Neue', sans-serif;
      background: #fbe9c6;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .logo {
      max-width: 200px;
      margin: 1em auto;
    }
    h1 {
      margin: 0;
      color: #7a420c;
      font-size: 2.4em;
      text-align: center;
    }
    .counter {
      background: #fff7dc;
      border: 2px solid #dcb96a;
      padding: 0.5em 1em;
      font-size: 2em;
      margin: 0.8em;
      border-radius: 15px;
    }
    .crumb {
      font-size: 4em;
      cursor: pointer;
      user-select: none;
    }
    .falling {
      position: absolute;
      font-size: 2em;
      cursor: pointer;
      user-select: none;
      animation: fall 4s linear forwards;
      z-index: 10;
    }
    @keyframes fall {
      from { top: -50px; }
      to { top: 90vh; opacity: 0; }
    }
    .upgrades {
      display: flex;
      flex-direction: column;
      gap: 0.5em;
      margin-top: 1em;
    }
    .upgrade-button {
      padding: 0.5em 1em;
      font-size: 1em;
      background: #f6d89d;
      border: 2px solid #b77b2e;
      border-radius: 10px;
      cursor: pointer;
    }
    .footer {
      margin-top: auto;
      text-align: center;
      font-size: 0.95em;
      color: #6e4b1e;
      padding: 1em;
      max-width: 320px;
    }
    .lang-buttons {
      margin-top: 1em;
    }
    .lang-buttons button {
      margin: 0 0.3em;
      font-size: 0.9em;
      background: #e2c388;
      border: none;
      padding: 0.3em 0.7em;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <img class="logo" src="https://www.puccipane.it/wp-content/uploads/2022/11/logo_pucci_2.png" alt="Pucci Logo">
  <h1>Briciole Clicker</h1>
  <p id="instructions">Clicca sul croissant per raccogliere briciole!</p>

  <div class="counter" id="counter">0</div>
  <div class="crumb" onclick="addCrumb()">🥐</div>

  <div class="upgrades">
    <button class="upgrade-button" onclick="buyUpgrade(1)" id="btn1">Nonna Pucci x2 (10)</button>
    <button class="upgrade-button" onclick="buyUpgrade(2)" id="btn2">Gatto Guardiano x5 (50)</button>
  </div>

  <div class="lang-buttons">
    <button onclick="setLang('it')">🇮🇹</button>
    <button onclick="setLang('en')">🇬🇧</button>
    <button onclick="setLang('ru')">🇷🇺</button>
  </div>

  <div class="footer" id="footerText">
    Gioco ispirato alla storica panetteria Pucci a Cirò Marina<br>
    <a href="https://www.puccipane.it" target="_blank">Visita il sito Pucci →</a>
  </div>

  <script>
    let count = parseInt(localStorage.getItem('crumbCount')) || 0;
    let multiplier = parseInt(localStorage.getItem('crumbMultiplier')) || 1;

    const counterEl = document.getElementById('counter');
    counterEl.textContent = count;

    function addCrumb() {
      count += multiplier;
      counterEl.textContent = count;
      localStorage.setItem('crumbCount', count);
    }

    function buyUpgrade(type) {
      if (type === 1 && count >= 10) {
        count -= 10;
        multiplier = 2;
      } else if (type === 2 && count >= 50) {
        count -= 50;
        multiplier = 5;
      }
      counterEl.textContent = count;
      localStorage.setItem('crumbCount', count);
      localStorage.setItem('crumbMultiplier', multiplier);
    }

    const footerTexts = {
      it: "Gioco ispirato alla storica panetteria Pucci a Cirò Marina<br><a href='https://www.puccipane.it' target='_blank'>Visita il sito Pucci →</a>",
      en: "A game inspired by the historic Pucci bakery in Cirò Marina<br><a href='https://www.puccipane.it' target='_blank'>Visit Pucci website →</a>",
      ru: "Игра, вдохновлённая исторической пекарней Pucci в Чиро Марина<br><a href='https://www.puccipane.it' target='_blank'>Сайт пекарни Pucci →</a>"
    };

    const instructionTexts = {
      it: "Clicca sul croissant per raccogliere briciole!",
      en: "Click the croissant to collect crumbs!",
      ru: "Кликай по круассану, чтобы собирать крошки!"
    };

    function setLang(lang) {
      document.getElementById('footerText').innerHTML = footerTexts[lang];
      document.getElementById('instructions').textContent = instructionTexts[lang];
      localStorage.setItem('crumbLang', lang);
    }

    const userLang = localStorage.getItem('crumbLang') || navigator.language.slice(0, 2);
    if (['it', 'en', 'ru'].includes(userLang)) setLang(userLang);
    else setLang('en');

    // spawn falling croissants
    setInterval(() => {
      const emoji = document.createElement('div');
      emoji.textContent = '🥐';
      emoji.className = 'falling';
      emoji.style.left = Math.random() * 90 + 'vw';
      emoji.onclick = () => {
        addCrumb();
        emoji.remove();
      };
      document.body.appendChild(emoji);
      setTimeout(() => emoji.remove(), 4000);
    }, 1500);
  </script>
</body>
</html>
