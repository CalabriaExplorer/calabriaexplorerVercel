<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cornetto Clicker</title>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Comic Neue', sans-serif;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      transition: background-image 0.5s ease-in-out;
    }
    .falling {
      position: absolute;
      font-size: 2em;
      cursor: pointer;
      animation: fall 4s linear forwards;
      z-index: 10;
    }
    @keyframes fall {
      from { top: -50px; }
      to { top: 90vh; opacity: 0; }
    }
    #finalScreen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #fff4dc;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      text-align: center;
      padding: 2em;
    }
    #finalScreen h2 {
      font-size: 1.5em;
      margin-bottom: 1em;
    }
    #bigCroissant {
      font-size: 6em;
      margin-bottom: 1em;
    }
    .restartBtn {
      padding: 0.5em 1em;
      font-size: 1.1em;
      background: #ffe08c;
      border: 2px solid #c0892d;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div id="finalScreen">
  <div id="bigCroissant">🥐</div>
  <h2 id="finalMessage"></h2>
  <button class="restartBtn" onclick="restartGame()">Ricomincia</button>
</div>

<script>
let count = parseInt(localStorage.getItem('crumbCount')) || 0;
let missed = 0;
let gameOver = false;
let lang = localStorage.getItem('crumbLang') || navigator.language.slice(0, 2);
if (!['it','en','ru'].includes(lang)) lang = 'en';

const messages = {
  it: "Vi aspettiamo da Pucci Pane per i cornetti più freschi e non solo :)",
  en: "Come visit Pucci Pane for the freshest croissants and more :)",
  ru: "Ждём вас в Pucci Pane за самыми свежими круассанами и не только :)",
};

function showFinalScreen() {
  document.getElementById('finalMessage').textContent = messages[lang];
  document.getElementById('finalScreen').style.display = 'flex';
}

function restartGame() {
  count = 0;
  missed = 0;
  gameOver = false;
  localStorage.removeItem('crumbCount');
  document.getElementById('finalScreen').style.display = 'none';
  document.location.reload();
}

setInterval(() => {
  if (gameOver) return;
  const emoji = document.createElement("div");
  const isBurned = Math.random() < 0.1;
  emoji.textContent = isBurned ? "🥐🔥" : "🥐";
  emoji.className = "falling";
  emoji.style.left = Math.random() * 90 + "vw";
  emoji.onclick = () => {
    if (isBurned) {
      gameOver = true;
      alert("🔥 Game Over! Hai cliccato su un cornetto bruciato.");
      restartGame();
    } else {
      count++;
      localStorage.setItem('crumbCount', count);
      emoji.remove();
      if (count >= 500) {
        showFinalScreen();
      }
    }
  };
  document.body.appendChild(emoji);
  setTimeout(() => {
    if (document.body.contains(emoji)) {
      emoji.remove();
      if (!isBurned) missed++;
      if (missed >= 10) {
        gameOver = true;
        alert("❌ Hai mancato troppi cornetti! Game Over.");
        restartGame();
      }
    }
  }, 4000);
}, 1500);
</script>
</body>
</html>
